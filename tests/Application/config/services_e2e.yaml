# Services for the `e2e` environment used by the Playwright tests (tests/Playwright).
# The Shipmondo client keeps the real SDK, but its HTTP transport is replaced by a stub, so no request
# ever leaves the machine and no Shipmondo credentials are needed.
services:
    setono_sylius_shipmondo.e2e.stub_http_client:
        class: Tests\Setono\SyliusShipmondoPlugin\Application\E2E\StubShipmondoHttpClient
        arguments:
            - '@request_stack'
            - '%kernel.project_dir%/E2E/shipmondo'
            - '%kernel.logs_dir%/shipmondo-stub.log'

    setono_sylius_shipmondo.client:
        class: Setono\Shipmondo\Client\Client
        arguments:
            $apiUser: '%setono_sylius_shipmondo.api.username%'
            $apiKey: '%setono_sylius_shipmondo.api.key%'
            $sandbox: '%setono_sylius_shipmondo.api.sandbox%'
            $httpClient: '@setono_sylius_shipmondo.e2e.stub_http_client'

    setono_sylius_shipmondo.e2e.stub_marker_listener:
        class: Tests\Setono\SyliusShipmondoPlugin\Application\E2E\StubMarkerListener
        tags:
            - { name: kernel.event_listener, event: kernel.response }
