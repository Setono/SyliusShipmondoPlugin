setono_sylius_shipmondo_admin_shipmondo_index:
    path: /shipmondo
    methods: [GET,POST]
    defaults:
        _controller: Setono\SyliusShipmondoPlugin\Controller\Admin\ShipmondoController::index
        
setono_sylius_shipmondo_admin_shipmondo_register_webhooks:
    path: /shipmondo/register-webhooks
    methods: [GET]
    defaults:
        _controller: Setono\SyliusShipmondoPlugin\Controller\Admin\ShipmondoController::registerWebhooks

setono_sylius_shipmondo_admin_order_retry_upload:
    path: /orders/{id}/retry-upload
    methods: [PUT]
    requirements:
        id: \d+
    defaults:
        _controller: Setono\SyliusShipmondoPlugin\Controller\Admin\RetryUploadController::retry

setono_sylius_shipmondo_admin_order_bulk_retry_upload:
    path: /orders/bulk/retry-upload
    methods: [PUT]
    defaults:
        _controller: Setono\SyliusShipmondoPlugin\Controller\Admin\RetryUploadController::bulkRetry
