setono_sylius_shipmondo:
    form:
        shipping_method:
            carrier_code_placeholder: Select carrier...
            pickup_point_delivery: Pickup point delivery
    
    shipmondo_failure:
        credentials_failure: Shipmondo did not accept the API credentials. Check SHIPMONDO_USERNAME and SHIPMONDO_KEY, and that SHIPMONDO_SANDBOX matches the Shipmondo account they belong to.
        rate_limited: Shipmondo is limiting how often the store may call it. Try again in a minute.
        temporary_failure: Shipmondo could not be reached, or had a server error. Try again later.
        not_found: 'Shipmondo could not find what was asked for: %error%'
        rejected: 'Shipmondo refused the request: %error%'
        unexpected_failure: 'Something unexpected went wrong when calling Shipmondo: %error%'
        unread_success: 'Shipmondo did what was asked, but its answer was cut off or could not be read: %error%'

    ui:
        cancelled: Cancelled
        failed: Failed
        last_upload: Last upload
        last_upload_next_step_failed: Fix what made the upload fail, then retry the upload.
        last_upload_next_step_pending: The next upload run uploads the order again.
        last_upload_next_step_unlinked: 'Nothing to retry: Shipmondo may have a sales order for the order, so the first upload run 10 minutes after this looks for it, links the order to it if it finds one, and uploads the order again only if Shipmondo has none.'
        map_payment_methods: Map payment methods
        map_payment_methods_empty_information: 'There are no configured payment gateways inside Shipmondo. Go to <a href="https://app.shipmondo.com/main/app/#/setting/integration/payment-gateway" target="_blank">Shipmondo</a> and create your first payment gateway.'
        map_payment_methods_information: Map your payment methods to the payment gateways in Shipmondo. This way, you will be able to capture the payment inside Shipmondo when fulfilling the order. If there's no equivalent payment gateway in Shipmondo, leave it empty.
        map_shipping_methods: Map shipping methods
        map_shipping_methods_empty_information: 'There are no shipment templates inside Shipmondo. Go to <a href="https://app.shipmondo.com/" target="_blank">Shipmondo</a> and create your first shipment template.'
        map_shipping_methods_information: Map your shipping methods to the shipment templates in Shipmondo. This way, shipments inside Shipmondo will have a shipment template assigned automatically. If there's no relevant shipment template in Shipmondo, leave it empty.
        missing_webhook: 'Missing: %name%'
        not_in_shipmondo: 'Not in Shipmondo (id %id%)'
        payment_gateways_not_loaded: The payment gateways could not be loaded from Shipmondo, so the payment methods can't be mapped now.
        payment_method_in_shipmondo: Payment method in Shipmondo
        payment_method_in_sylius: Payment method in Sylius
        pending: Pending
        pickup_point_delivery: Pickup point delivery
        pickup_points_not_loaded: The pickup points could not be loaded. Try again, or choose another shipping method.
        register_webhooks: Register webhooks
        register_webhooks_information: The webhooks are not registered yet, or not since the plugin started recording where Shipmondo sends them. Register them with the button below, with the admin opened at the shop's hostname.
        retry_upload: Retry upload
        retry_upload_to_shipmondo: Retry upload to Shipmondo
        sales_order_id: Sales order id
        select_shipmondo_payment_method: Select payment method...
        shipment_templates_in_shipmondo: Shipment templates in Shipmondo
        shipment_templates_not_loaded: The shipment templates could not be loaded from Shipmondo, so the shipping methods can't be mapped now.
        shipmondo: Shipmondo
        shipmondo_index: Manage your Shipmondo settings
        shipmondo_state: Shipmondo state
        shipping_method_in_sylius: Shipping method in Sylius
        stale_payment_gateways: 'These payment methods are mapped to a payment gateway that no longer exists in Shipmondo, so Shipmondo may not capture their payments. Map them to an existing payment gateway, or remove the mapping:'
        stale_shipment_templates: 'These shipping methods allow shipment templates that no longer exist in Shipmondo, so their orders may get another shipment template, or none. Remove them, or allow existing ones instead:'
        status_code: Status code
        try_again: Try again
        unlinked: Unlinked
        unwanted_inactive_webhook: 'To remove: %name%, sent to %endpoint%, inactive'
        unwanted_webhook: 'To remove: %name%, sent to %endpoint%'
        uploaded_to_shipmondo: Uploaded to Shipmondo
        uploading_to_shipmondo: Uploading to Shipmondo
        webhooks: Webhooks
        webhooks_do_not_match: "This shop's webhooks in Shipmondo don't match the ones the plugin handles:"
        webhooks_do_not_match_next_step: Register them again with the button below.
        webhooks_do_not_match_next_step_automatically: The next upload run registers them again, or register them now with the button below.
        webhooks_match: This shop's webhooks in Shipmondo match the ones the plugin handles.
        webhooks_not_loaded: This shop's webhooks could not be loaded from Shipmondo, so whether they match the ones the plugin handles is unknown now.
        webhooks_not_registered_automatically: Registering the webhooks automatically is turned off, so register them again after upgrading the plugin.
        webhooks_registered_automatically: Once they are registered, every upload run registers them again at the same endpoint whenever this shop's webhooks in Shipmondo no longer match the ones the plugin handles, e.g. after an upgrade.
        webhooks_registered_information: The webhooks were last registered at %endpoint% on %date%.
        when: When
